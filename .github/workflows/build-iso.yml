name: Build RebuiltArch ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system and install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git github-cli

      - name: Verify workspace
        run: |
          pwd
          ls -la
          test -f build.sh
          test -f profile/profiledef.sh
          test -f profile/packages.x86_64

      - name: Build ISO
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Verify ISO size
        shell: bash
        run: |
          ISO="$(find ./out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          SIZE="$(stat -c '%s' "$ISO")"
          echo "ISO size: $SIZE bytes"
          if [ "$SIZE" -ge 2147483648 ]; then
            echo "ERROR: ISO exceeds GitHub's 2 GiB release asset limit."
            exit 1
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuiltarch-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 7

      - name: Publish ISO as GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ISO="$(find ./out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload nightly "$ISO" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create nightly "$ISO" --prerelease --title "RebuiltArch Nightly" --notes "Latest automatically built RebuiltArch ISO." --repo "$GITHUB_REPOSITORY"
          fi
