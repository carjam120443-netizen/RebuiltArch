name: Build RebuiltArch ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update system and install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git

      - name: Verify workspace
        run: |
          pwd
          ls -la
          test -f build.sh
          test -f profile/profiledef.sh

      - name: Build ISO
        shell: bash
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: rebuiltarch-iso
          path: out/*.iso
          if-no-files-found: error
