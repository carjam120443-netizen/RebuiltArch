# RebuiltArch live ISO initramfs configuration.
# These Archiso hooks are required so the initramfs can locate the ISO,
# mount the SquashFS live root, and switch from initrd to the live system.
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
